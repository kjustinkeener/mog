[package]
name = "mog-studio"
version = "0.1.2"
description = "Desktop workbench for the Mog text-transform engine."
authors = ["Justin Keener"]
license = "MIT"
repository = "https://github.com/kjustinkeener/mog"
homepage = "https://github.com/kjustinkeener/mog/tree/main/studio"
readme = "../README.md"
keywords = ["text", "regex", "refactoring", "gui", "tauri"]
categories = ["development-tools", "gui"]
edition = "2021"
rust-version = "1.77.2"
# This is an application, not a library anyone should pull from a registry.
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
flate2 = "1.0"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
flate2 = "1.0"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
