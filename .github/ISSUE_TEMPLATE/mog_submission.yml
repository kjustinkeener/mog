name: Mog idea
description: Propose a mog for the library (or offer to contribute one).
labels: ["mog"]
body:
  - type: markdown
    attributes:
      value: |
        Mogs are the most welcome contribution. If you can, open a pull request
        with the `.mog` plus its `TestInput` / `TestExpectedOutput` fixture instead
        of an issue. See CONTRIBUTING.md for the bar a mog should meet.
  - type: textarea
    id: job
    attributes:
      label: What job does it do?
      description: One clear purpose. What text goes in, what comes out?
    validations:
      required: true
  - type: textarea
    id: alternative
    attributes:
      label: What would the user do without it?
      description: >
        A mog earns a slot by beating the target user's best alternative. Is
        this in the moat (block/region ops, dialect conversion, a fiddly tested
        pipeline), or an everyday cleanup whose win is preview + backup for a
        non-CLI user? A one-line sed/tr equivalent for a technical user is not a fit.
    validations:
      required: true
  - type: input
    id: example
    attributes:
      label: A concrete before/after example
      description: A short input line and the expected output line.
    validations:
      required: false
