name: Bug report
description: Something in the engine or CLI does not behave as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. A minimal `.mog` script plus input that reproduces
        the problem is the single most helpful thing you can include.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what did you get instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: A minimal `.mog` script and input, plus the exact command you ran.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: mog version
      description: Output of `mog --version`.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: OS and architecture (e.g. Windows 11 x64, macOS arm64, Ubuntu 24.04).
    validations:
      required: true
