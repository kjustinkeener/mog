name: catalog

# Publish a signed engine/Studio catalog release: build the dist engine and the
# Studio installer, sign engine.json + studio.json, and upload all four JSON
# files plus both binaries as assets on a `catalog-<version>` GitHub Release.
# The client reads these from the release "latest/download" prefix (see
# ENGINE_TRACK_DEFAULT_URL); the mog-market catalog (index.json) is untouched.
#
# Tag-driven (plus manual): pushing a `v*` tag builds and publishes the signed
# catalog for that version, and `workflow_dispatch` can still run it by hand with
# an explicit version. release.yml also fires on `v*` but publishes the standalone
# engine binaries as a NON-latest release, so the `catalog-<version>` release here
# stays the one `releases/latest/download/` resolves to (no ordering race).
#
# Key hygiene: signing is isolated in its own `release` job that uses ONLY
# first-party (actions/*) steps, so the decrypted signing key never shares a
# runner with a third-party action. The `build` job carries all the third-party
# actions (pinned to commit SHAs) and never sees the secret.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Catalog version, e.g. 0.1.2 (tag becomes catalog-<version>)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: build binaries
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Third-party actions pinned to commit SHAs (see key-hygiene note above).
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            mog-rs
            studio/src-tauri
      - uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: studio/package-lock.json

      # 1. Build the engine (dist profile) and the signing tool in one pass so
      #    they share the build cache. market-admin reuses the mog library's
      #    manifest + crypto contract, so the signed JSON can never drift.
      - name: Build engine + market-admin (dist)
        working-directory: mog-rs
        run: cargo build --profile dist --bin mog --bin market-admin

      # 2. Stage the dist engine where Studio's build.rs embeds it, so the
      #    embedded engine is byte-identical to the standalone download.
      - name: Stage engine into Studio
        shell: pwsh
        run: |
          $dist = "mog-rs/target/dist/mog.exe"
          if (-not (Test-Path $dist)) { throw "dist engine not found at $dist" }
          New-Item -ItemType Directory -Force -Path "studio/src-tauri/binaries" | Out-Null
          Copy-Item $dist "studio/src-tauri/binaries/mog-dist.exe" -Force
          "MOG_DIST_EXE=$((Resolve-Path $dist).Path)" >> $env:GITHUB_ENV
          "MOG_STUDIO_BUILD_DATE=$(Get-Date -Format 'yyyy-MM-dd')" >> $env:GITHUB_ENV

      # 3. Build Studio (embeds the staged engine). build:wasm first: the
      #    frontend imports the gitignored regex-wasm module.
      - name: Build Studio installer
        working-directory: studio
        run: |
          npm ci
          npm run build:wasm
          npm run build
          npx tauri build --no-bundle

      # 4. Hand the three binaries to the isolated signing job. No secret here.
      - name: Collect binaries
        shell: pwsh
        run: |
          $stage = "bins"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "mog-rs/target/dist/mog.exe"                       $stage -Force
          Copy-Item "mog-rs/target/dist/market-admin.exe"             $stage -Force
          Copy-Item "studio/src-tauri/target/release/mog-studio.exe"  $stage -Force
      - uses: actions/upload-artifact@v4
        with:
          name: bins
          path: bins/
          retention-days: 1

  release:
    name: sign + publish catalog
    needs: build
    runs-on: windows-latest
    # First-party actions only in this job: the signing key is decrypted here and
    # must not share the runner with any third-party action.
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: bins
          path: bins

      # Resolve the catalog version from the dispatch input, else the pushed
      # `v*` tag with the leading `v` stripped.
      - name: Resolve version
        shell: pwsh
        run: |
          $v = "${{ inputs.version }}"
          if (-not $v) { $v = "${{ github.ref_name }}" -replace '^v', '' }
          if (-not $v) { throw "no version: neither a dispatch input nor a v* tag" }
          "VERSION=$v" >> $env:GITHUB_ENV

      # 5. Sign engine.json + studio.json, pointing at the release asset URLs.
      #    The signing key secret is written to a temp file and passed as @path,
      #    never on the command line or in logs.
      - name: Sign manifests
        shell: pwsh
        env:
          MARKET_SIGNING_KEY: ${{ secrets.MARKET_SIGNING_KEY }}
        run: |
          if (-not $env:MARKET_SIGNING_KEY) { throw "MARKET_SIGNING_KEY secret is not set on this repo" }
          $keyFile = Join-Path $env:RUNNER_TEMP "market-sign-key.txt"
          Set-Content -Path $keyFile -Value $env:MARKET_SIGNING_KEY -NoNewline
          $reg = Join-Path $env:RUNNER_TEMP "registry"
          New-Item -ItemType Directory -Force -Path $reg | Out-Null
          $urlBase = "https://github.com/${{ github.repository }}/releases/latest/download"
          $admin  = "bins/market-admin.exe"
          $engine = "bins/mog.exe"
          $studio = "bins/mog-studio.exe"
          try {
            & $admin engine --version "$env:VERSION" `
              --platform "windows-x86_64=$engine" --url-base $urlBase `
              --sign-key "@$keyFile" --out $reg
            if ($LASTEXITCODE -ne 0) { throw "engine.json signing failed" }
            & $admin studio --version "$env:VERSION" `
              --platform "windows-x86_64=$studio" --url-base $urlBase `
              --sign-key "@$keyFile" --out $reg
            if ($LASTEXITCODE -ne 0) { throw "studio.json signing failed" }
          } finally {
            Remove-Item $keyFile -Force -ErrorAction SilentlyContinue
          }
          $stage = Join-Path $env:RUNNER_TEMP "assets"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item $engine (Join-Path $stage "mog.exe") -Force
          Copy-Item $studio (Join-Path $stage "mog-studio.exe") -Force
          Copy-Item (Join-Path $reg "engine.json")     $stage -Force
          Copy-Item (Join-Path $reg "engine.json.sig") $stage -Force
          Copy-Item (Join-Path $reg "studio.json")     $stage -Force
          Copy-Item (Join-Path $reg "studio.json.sig") $stage -Force
          "ASSET_DIR=$stage" >> $env:GITHUB_ENV

      # 6. Publish via the gh CLI (preinstalled; no third-party action). --latest
      #    keeps latest/download resolving to this signed catalog release;
      #    release.yml's standalone-binary release is published make_latest:false,
      #    so it never contests "latest" no matter which workflow finishes first.
      - name: Publish catalog release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem $env:ASSET_DIR -File | ForEach-Object { $_.FullName }
          gh release create "catalog-$env:VERSION" $assets `
            --repo "${{ github.repository }}" `
            --title "catalog-$env:VERSION" `
            --notes "Signed engine + Studio catalog build $env:VERSION." `
            --latest
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
