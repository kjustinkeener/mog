name: ci
on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # uses: actions/checkout@v3 -- the old pin, kept for reference
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: some-org/nightly-action@main
      - uses: ./.github/actions/local-setup
      - uses: docker://alpine:3.19
      - uses: docker://alpine@sha256:c5b1261d6d3e43071626931fc004f70149baeba2c8ec672bd4f27761f8e1ad6b
      - name: Install a tool
        run: curl -sSL https://example.test/install.sh | bash
      - name: Fetch and check
        run: |
          curl -sSL https://example.test/tool.tar.gz -o tool.tar.gz
          sha256sum -c tool.sha256
      - uses: actions/upload-artifact@v4.3.1 # keep the build output
