# Rendered by: helm template shop ./charts/shop
apiVersion: v1
kind: Namespace
metadata:
  name: shop-prod
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: shop-config
  namespace: shop-prod
  labels:
    app.kubernetes.io/name: shop
data:
  MOTD: |
    Welcome to the shop.
    ---
    Not a document separator.
  GREETING: "hello, world"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-web
  namespace: shop-prod
spec:
  replicas: 3
  template:
    spec:
      containers:
        - name: web
          image: ghcr.io/example/shop:1.4.2
          command: ["sh", "-c", "exec /app/serve"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: shop-reader
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
...
---
# a comment-only document
---
apiVersion: v1
kind: Service
metadata:
  name: 'shop-web, external'
  namespace: shop-prod
spec:
  ports:
    - port: 80
---
apiVersion: v1
kind: Secret
metadata:
  namespace: shop-prod
type: Opaque
---
resources:
  - deployment.yaml
namePrefix: shop-
